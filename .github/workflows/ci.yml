name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Ruff and pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install GTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libatk1.0-dev \
            libxtst-dev

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff lint
        run: uv run --frozen ruff check .

      - name: Run Ruff format check
        run: uv run --frozen ruff format --check .

      - name: Run pytest
        run: uv run --frozen pytest

      - name: Run import smoke check
        run: >
          uv run --frozen python -c
          "import powercalc; import powercalc.gui;
          from powercalc.version import get_version;
          print(f'Powercalc {get_version()} import smoke check passed.')"

  windows-liblouis-smoke:
    name: Windows Liblouis portable smoke check
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build Windows portable artifact
        run: uv run --frozen python -m tools.build portable

      - name: Smoke-test bundled Liblouis runtime
        run: >
          uv run --frozen python -m tools.braille_smoke
          dist/Powercalc

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: powercalc-windows-liblouis-spike
          path: dist/release/*-portable.zip
